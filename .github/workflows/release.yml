name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "cursor-cleanup-${{ matrix.target }}"
          New-Item -ItemType Directory -Path dist/$name -Force | Out-Null
          Copy-Item target/${{ matrix.target }}/release/cursor-cleanup.exe dist/$name/
          Copy-Item README.md,LICENSE dist/$name/
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name.zip
          # Also publish bare .exe for one-click download
          Copy-Item target/${{ matrix.target }}/release/cursor-cleanup.exe dist/cursor-cleanup.exe
          echo "ASSET_ZIP=dist/$name.zip" >> $env:GITHUB_ENV
          echo "ASSET_EXE=dist/cursor-cleanup.exe" >> $env:GITHUB_ENV

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          name="cursor-cleanup-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/cursor-cleanup" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ASSET_ZIP=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact (archive)
        uses: actions/upload-artifact@v4
        with:
          name: cursor-cleanup-${{ matrix.target }}
          path: ${{ env.ASSET_ZIP }}

      - name: Upload artifact (Windows exe)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cursor-cleanup-windows-exe
          path: ${{ env.ASSET_EXE }}

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name 'cursor-cleanup.exe' \) -exec cp {} release-assets/ \;
          ls -lah release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
